ódigo</text></g><g transform="translate(456 261)"><rect width="128" height="62" rx="12" fill="#1b1832" stroke="#4ade80" stroke-opacity=".35"/><rect width="128" height="62" rx="12" fill="#4ade80" fill-opacity=".16" stroke="#4ade80" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0000;0.7384;0.7534;0.8234;1.0000" dur="14s" repeatCount="indefinite"/></rect><rect x="12" y="14" width="8" height="8" fill="#4ade80"/><text x="28" y="23" class="t">Financeiro</text><text x="12" y="46" class="s">lucro líquido</text></g><g transform="translate(256 261)"><rect width="128" height="62" rx="12" fill="#1b1832" stroke="#f2c14e" stroke-opacity=".35"/><rect width="128" height="62" rx="12" fill="#f2c14e" fill-opacity=".16" stroke="#f2c14e" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0.0000;0.8207;0.8357;0.9057;1.0000" dur="14s" repeatCount="indefinite"/></rect><rect x="12" y="14" width="8" height="8" fill="#f2c14e"/><text x="28" y="23" class="t">Meta batida</text><text x="12" y="46" class="s">ou teto · ou prazo</text></g>
